name: Python 제어코드 테스트
on:
  push:
  pull_request:
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4
      - name: Python 설치
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 유닛 테스트 실행
        run: python -m unittest discover -s tests -v
      - name: 모의 실행
        run: python main.py
